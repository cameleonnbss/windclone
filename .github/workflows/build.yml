name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm xorriso qemu-system-x86 ovmf

      - name: Fetch Limine boot files
        run: |
          chmod +x tools/*.sh
          ./tools/fetch-limine.sh

      - name: Build kernel + ISO
        run: make -j"$(nproc)"

      # The whole suite lives in tools/local-test.sh — the same file a
      # contributor runs on their laptop (see docs/CONTRIBUTING.md). CI used
      # to carry its own copy of these greps, and the two lists drifted: the
      # window-manager checks existed locally and not here. One list now.
      #
      # It covers, in order: no SSE in the kernel image, BIOS boot, UEFI
      # boot under OVMF, the two-stage MBR, and the window manager driven by
      # real PS/2 clicks injected through the QEMU monitor.
      - name: Boot + window-manager smoke tests
        run: ./tools/local-test.sh

      - name: Build educational MBR image
        run: make mbr

      - uses: actions/upload-artifact@v4
        with:
          name: windclone-iso
          path: windclone.iso
