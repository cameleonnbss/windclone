# WindClone boot entries — shipped inside the ISO at /boot/limine.conf
# (Limine only scans for the name `limine.conf` — this filename is fixed.)
# Limine config syntax v6+: `option: value`, entries start with `/`.
# Paths use the resource form `boot():/...` = partition holding this config.

# Global options
timeout: 3                # auto-boot first entry after 3s (unattended CI)
serial: yes               # mirror bootloader messages to COM1 (debug gold)
graphics: yes             # Phase 8 needs the linear framebuffer Limine sets up
                          # (the kernel keeps a text fallback if none arrives);
                          # best-effort hint — some
                          # Limine/QEMU combos stay on the GUI framebuffer,
                          # so the kernel ALSO drops the card back to text
                          # itself (see src/kernel/vga.c vga_text_mode_init)
interface_branding: WindClone

# Boot entry
/WindClone
protocol: limine
path: boot():/boot/kernel.elf
# tar archive packed from rootfs/ by tools/mkinitrd.sh, loaded into RAM
# beside the kernel; src/kernel/initrd.c parses it in place.
module_path: boot():/boot/initrd.tar
kaslr: no
textmode: no              # hand off the graphical mode, not a text one
resolution: 1024x768x32   # what the desktop below is laid out for
